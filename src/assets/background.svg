<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="100%" stop-color="#B2EBF2" />
    </linearGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.52 0 0 0 0 0.80 0 0 0 0 0.92 0 0 0 .1 0" />
    </filter>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="url(#skyGradient)" />
  <rect x="0" y="0" width="100%" height="100%" filter="url(#noise)"/>
</svg>